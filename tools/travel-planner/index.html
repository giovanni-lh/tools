<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Planner — Old Style</title>
  <link rel="stylesheet" href="../../style.css" />
  <!-- KaTeX for Old Style Serif Math/Text rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <!-- URL Hash Compression Library -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>

<body class="solarized-theme">
  <div class="container">
    <a href="../../" class="back-btn">← Back to Tools Hub</a>

    <header class="planner-header">
      <h1 id="latex-title"></h1>
      <p class="subtitle">Organize itinerary activities with drag-and-drop reordering.</p>
    </header>

    <!-- Toggle Form Button -->
    <div style="margin-bottom: 20px;">
      <button id="toggle-form-btn" class="btn">+ Add New Plan</button>
    </div>

    <!-- Form Section (Hidden by default) -->
    <div id="form-container" class="card form-card" style="display: none;">
      <div class="form-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 id="form-title">Add Itinerary Item</h2>
        <button id="close-form-btn" class="delete-btn" style="font-size: 1.5rem;" title="Close form">✕</button>
      </div>
      <form id="planner-form">
        <input type="hidden" id="edit-item-id" value="" />
        <div class="form-row">
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>
          <div class="form-group">
            <label for="time">Time</label>
            <input type="time" id="time" required />
          </div>
        </div>

        <div class="form-group">
          <label for="destination">Destination</label>
          <input type="text" id="destination" placeholder="e.g. Kyoto Imperial Palace" required />
        </div>

        <div class="form-group">
          <label for="activity">Activity Details</label>
          <input type="text" id="activity" placeholder="e.g. Morning walk through gardens" required />
        </div>

        <div class="form-group">
          <label for="map-link">Google Maps URL</label>
          <input type="url" id="map-link" placeholder="https://maps.google.com/..." />
        </div>

        <div class="form-group">
          <label for="photo-input">Sample Photo Review (Auto Resized & Rescaled)</label>
          <input type="file" id="photo-input" accept="image/*" />
        </div>

        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn" id="submit-btn">Add to Itinerary</button>
          <button type="button" class="btn" style="background-color: #839496;" id="cancel-btn">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Itinerary Section -->
    <div class="card">
      <h2>Itinerary</h2>
      <p class="drag-hint" style="font-size: 0.85rem; color: #839496; margin-bottom: 10px;">Drag handle ☰ to reorder items</p>
      <ul id="itinerary-list" class="drag-list"></ul>
      <p id="empty-state" style="text-align: center; color: #839496; padding: 20px;">
        No items yet. <button id="quick-add-btn" class="btn" style="background: none; border: none; color: #268bd2; cursor: pointer; text-decoration: underline; padding: 0;">Add your first plan</button>
      </p>
    </div>

    <!-- Generate Hash Link Card -->
    <div class="card">
      <h2>Share Itinerary</h2>
      <p style="margin-bottom: 15px; font-size: 0.9rem;">
        Click below when finished planning to generate a shareable URL containing your full itinerary.
      </p>
      <button id="generate-url-btn" class="btn">🔗 Generate Share Link</button>

      <div id="url-output-container" style="display: none; margin-top: 15px;">
        <input type="text" id="generated-url" readonly style="width: 100%; padding: 8px 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;" />
        <button id="copy-url-btn" class="btn" style="background-color: #268bd2;">Copy Link to Clipboard</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
